<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Requests</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: #fbfbfb;
      color: #333;
    }

    section {
      padding: 40px 180px;
    }

    img {
      width: 120px;
      height: auto;
      margin: 0px auto 20px auto;
      display: block;
    }

    h2 {
      background: linear-gradient(90deg, #972E26, #9e140a, #f2d1d1, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin: 20px 0px 60px 0px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 100%;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    label {
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
      background: #fff;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #b23a30;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #972E26;
      outline: none;
      box-shadow: 0 0 0 2px rgba(151, 46, 38, 0.2);
      transform: scale(1.01);
    }

    .hint {
      color: #972E26;
      font-size: 12px;
      margin-top: 4px;
    }

    .mandatory::after {
      content: " *";
      color: red;
    }

    textarea {
      resize: none;
      min-height: 80px;
      width: 100%;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .close-btn {
      background: #e0e0e0;
      color: #333;
    }

    .submit-btn {
      background: linear-gradient(90deg, #972E26, #b12a20);
      color: #fff;
    }

    .close-btn:hover {
      background: #d1d1d1;
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #b12a20, #972E26);
    }

    .success-message {
      display: none;
      width: 30%;
      text-align: center;
      margin: 20px auto 0px auto;
      font-weight: 500;
      color: #972E26;
      font-size: 13px;
    }

    @media (max-width: 1000px) {
      section {
        padding: 30px 50px;
      }

      .form-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }

    .error {
      color: red;
      font-size: 12px;
      margin-top: 5px;
      display: none;
      transition: opacity 0.3s;
    }

    .custom-select {
      position: relative;
      user-select: none;
    }

    .select-selected {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      background: #fff;
      color: black;
      font-size: 14px;
    }

    .select-items {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 99;
      display: none;
    }

    .select-items.active {
      display: block;
    }

    .select-search {
      width: 100%;
      padding: 8px 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .option-item {
      padding: 10px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f2d1d1;
    }
    #email {
      width: 44%;
      box-sizing: border-box;
    }

  </style>
</head>

<body>
  <section>
    <div class="form-container">
      <img src="/assets/jh_digitrack/images/jaleel%20holdings%201.png" alt="logo">
      <h2>Employee Requests</h2>
      <form id="requestForm">

        <div class="form-row">
          <div class="form-group">
            <label for="requesterName">Requester Name</label>
            <div class="custom-select" id="requesterDropdown">
              <div class="select-selected">Select User</div>
              <div class="select-items">
                <input type="text" placeholder="Search..." class="select-search" />
                <div class="options-container"></div>
              </div>
            </div>
            <p class="hint">(If selected can be tracked via Digitrack)</p>
          </div>

          <div class="form-group">
            <label for="category" class="mandatory">Category</label>
            <select id="category">
              <option value="">Select Category</option>
              <option value="Idea">Idea</option>
              <option value="Suggestion">Suggestion</option>
              <option value="Training Request">Training Request</option>
              <option value="Others">Others</option>
            </select>
            <p class="error" id="categoryError">Choose any category</p>
          </div>
        </div>

        <div class="form-group" id="emailGroup" style="display: none;">
          <label for="email">Email Id</label>
          <input type="email" id="email" placeholder="Enter Email Id" readonly>
        </div>

        <div class="form-group">
          <label for="idea" class="mandatory">Share your Idea / Suggestion / Training Request</label>
          <textarea id="idea" placeholder="Write here..."></textarea>
          <p class="error" id="ideaError">This field shouldn't be empty</p>
        </div>

        <div class="btn-group">
          <button type="button" class="close-btn">Close</button>
          <button type="submit" class="submit-btn">Submit</button>
        </div>
      </form>

      <div class="success-message" id="successMessage"></div>
    </div>
  </section>

  <script>
    const form = document.getElementById('requestForm');
    const successMsg = document.getElementById('successMessage');
    const emailInput = document.getElementById('email');
    const emailGroup = document.getElementById('emailGroup');
    const categorySelect = document.getElementById('category');
    const ideaInput = document.getElementById('idea');
    const categoryError = document.getElementById('categoryError');
    const ideaError = document.getElementById('ideaError');

    const requesterDropdown = document.getElementById("requesterDropdown");
    const selectedDiv = requesterDropdown.querySelector(".select-selected");
    const itemsDiv = requesterDropdown.querySelector(".select-items");
    const searchInput = requesterDropdown.querySelector(".select-search");
    const optionsContainer = requesterDropdown.querySelector(".options-container");

    let usersList = [];
    let recentUsers = [];

    async function loadRequesterNames() {
      try {
        const res = await fetch("/api/method/jh_digitrack.api.proxy_jh_users.get_jh_users");
        const data = await res.json();
        const usersData = data?.message?.users?.message;
        usersList = Array.isArray(usersData) ? usersData : [usersData];

        recentUsers = usersList.slice(0, 10);
        renderOptions(recentUsers);
        updateEmailVisibility();
      } catch (err) {
        console.error("Error loading requester names:", err);
      }
    }

    function renderOptions(list) {
      optionsContainer.innerHTML = "";
      list.forEach(user => {
        const div = document.createElement("div");
        div.className = "option-item";
        div.textContent = user.full_name || user.name;
        div.dataset.email = user.email || '';
        div.dataset.value = user.name;
        div.addEventListener("click", () => {
          selectedDiv.textContent = div.textContent;
          emailInput.value = div.dataset.email || '';
          itemsDiv.classList.remove("active");
          recentUsers = [user, ...recentUsers.filter(u => u.name !== user.name)].slice(0, 10);
          updateEmailVisibility();
          clearSuccessMessage();
        });
        optionsContainer.appendChild(div);
      });
    }

    function updateEmailVisibility() {
      if (selectedDiv.textContent !== "Select User") {
        emailGroup.style.display = "block";
      } else {
        emailGroup.style.display = "none";
        emailInput.value = "";
      }
    }

    function clearSuccessMessage() {
      successMsg.style.display = 'none';
      successMsg.innerHTML = '';
    }

    [categorySelect, ideaInput, emailInput].forEach(el => el.addEventListener('input', clearSuccessMessage));
    selectedDiv.addEventListener('click', clearSuccessMessage);
    successMsg.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') {
        clearSuccessMessage();
      }
    });
    selectedDiv.addEventListener("click", () => {
      itemsDiv.classList.toggle("active");
      searchInput.value = "";
      filterOptions("");
      searchInput.focus();
      updateEmailVisibility();
    });

    searchInput.addEventListener("input", (e) => filterOptions(e.target.value));

    function filterOptions(query) {
      const filtered = usersList.filter(u =>
        (u.full_name || u.name).toLowerCase().includes(query.toLowerCase())
      );
      renderOptions(filtered);
    }

    loadRequesterNames();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearSuccessMessage();

      const category = categorySelect.value.trim();
      const idea = ideaInput.value.trim();
      const requester_name = selectedDiv.textContent === "Select User" ? "" : selectedDiv.textContent;
      const email = emailInput.value.trim() || "";

      let hasError = false;
      if (!category) { categoryError.style.display = 'block'; hasError = true; } else { categoryError.style.display = 'none'; }
      if (!idea) { ideaError.style.display = 'block'; hasError = true; } else { ideaError.style.display = 'none'; }
      if (hasError) { return; }

      try {
        const res = await fetch("/api/method/jh_digitrack.api.proxy_jh_users.create_jh_task", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requester_name, email, category, idea })
        });

        const data = await res.json();
        const response = data?.message?.message || data?.message || data;

        if (response.status === "success") {
          successMsg.innerHTML = `${response.message} <br><a href="https://digitrack.jaleelholdings.com/login" target="_blank">Login to Digitrack</a>`;
          successMsg.style.display = 'block';
          
          form.reset();
          selectedDiv.textContent = 'Select User';
          updateEmailVisibility();
          categoryError.style.display = 'none';
          ideaError.style.display = 'none';
        } else {
          successMsg.textContent = `Error: ${response.message || 'Something went wrong'}`;
          successMsg.style.display = 'block';
        }
      } catch (err) {
        console.error("Submission error:", err);
        successMsg.textContent = "Something went wrong while creating the task.";
        successMsg.style.display = 'block';
      }
    });

    document.querySelector('.close-btn').addEventListener('click', () => {
      form.reset();
      selectedDiv.textContent = 'Select User';
      updateEmailVisibility();
      categoryError.style.display = 'none';
      ideaError.style.display = 'none';
      clearSuccessMessage();
    });

    categorySelect.addEventListener('change', () => { if (categorySelect.value) clearSuccessMessage(); });
    ideaInput.addEventListener('input', () => { if (ideaInput.value.trim()) clearSuccessMessage(); });

    window.addEventListener('DOMContentLoaded', () => {
      form.reset();
      selectedDiv.textContent = 'Select User';
      categorySelect.value = '';
      ideaInput.value = '';
      updateEmailVisibility();
      categoryError.style.display = 'none';
      ideaError.style.display = 'none';
      clearSuccessMessage();
    });
  </script>

</body>
</html>
