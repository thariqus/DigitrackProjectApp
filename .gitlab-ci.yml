stages:
  - deploy

deploy:
  stage: deploy
  script:
    - apk update
    - apk upgrade
    - apk add openssh
    - mkdir -p /root/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > /root/.ssh/id_rsa
    - chmod 600 /root/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > /root/.ssh/config
    - ssh -i /root/.ssh/id_rsa $SSH_USER@$SSH_HOST "source .nvm/nvm.sh && nvm use default && cd jeem-testing && bench update --reset"
  only:
    - develop
